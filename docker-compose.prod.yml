# Production stack for e-klix.com on the shared server.
#   docker compose -p klix -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only binds to localhost on ports no other app uses; nginx proxies e-klix.com
# here (see deploy/nginx/e-klix.com). Postgres has no host port.
services:
  db:
    image: postgres:16-alpine
    container_name: klix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: klix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: klix
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klix"]
      interval: 5s
      retries: 10

  api:
    build: ./apps/api
    container_name: klix_api
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env.production
    environment:
      DATABASE_URL: ecto://klix:${POSTGRES_PASSWORD}@db/klix
      PORT: "4000"
    volumes: [uploads:/app/uploads]
    ports: ["127.0.0.1:${KLIX_API_PORT:-4400}:4000"]

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    container_name: klix_web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]
    ports: ["127.0.0.1:${KLIX_WEB_PORT:-3400}:3000"]

volumes:
  pgdata:
  uploads:
